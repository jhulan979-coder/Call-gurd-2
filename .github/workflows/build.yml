name: Build Call Guard

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p lib native
          cp .github/workflows/*.dart lib/ 2>/dev/null || true
          cp ./*.dart lib/
          for f in main core tabs ai_tab calls_tab protect receptionist_tab settings_page; do
            test -f lib/$f.dart || { echo "$f.dart NAHI MILI"; exit 1; }
          done
          for k in MainActivity CallGuardScreeningService CallGuardInCallService InCallActivity DialerRole CircleLookup; do
            [ -f native/$k.kt ] || cp $k.kt native/$k.kt || cp .github/workflows/$k.kt native/$k.kt || { echo "$k.kt NAHI MILI"; exit 1; }
          done
          test -f pubspec.yaml || { echo "PUBSPEC NAHI MILI"; exit 1; }
          sed -i "s#import 'ai_tab.dart';#import 'ai_tab.dart';\nimport 'receptionist_tab.dart';#" lib/main.dart
          sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'protect.dart';\nimport 'settings_page.dart';#" lib/main.dart
          sed -i "s#const BlockedTab(),#const BlockedTab(),\n          const CallsTab(),#" lib/main.dart
          sed -i "s#const AiTab(),#const AiHub(),#" lib/main.dart
          sed -i "s#label: 'Blocked'),#label: 'Blocked'),\n          NavigationDestination(icon: Icon(Icons.contacts_outlined), label: 'Contacts'),#" lib/main.dart
          CARDS="\n            const ProtectCard(),\n            const SizedBox(height: 8),"
          if [ -f lib/ai_extra.dart ]; then
            sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'ai_extra.dart';#" lib/main.dart
            CARDS="$CARDS\n            const AiToolsCard(),\n            const SizedBox(height: 8),"
          fi
          if [ -f lib/invite.dart ]; then
            sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'invite.dart';#" lib/main.dart
            CARDS="$CARDS\n            const InviteCard(),\n            const SizedBox(height: 8),"
          fi
          sed -i "s#const SizedBox(height: 8),#const SizedBox(height: 8),$CARDS#" lib/main.dart
          W="child ?? const SizedBox.shrink()"
          if [ -f lib/applock.dart ]; then
            sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'applock.dart';#" lib/main.dart
            W="AppLockGate(child: $W)"
            grep -q "crypto:" pubspec.yaml || sed -i 's#^\(  flutter_tts:.*\)$#\1\n  crypto: ^3.0.3#' pubspec.yaml
            grep -q "crypto:" pubspec.yaml || { echo "CRYPTO PACKAGE NAHI JURA"; exit 1; }
            sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'applock.dart';#" lib/settings_page.dart
            sed -i "s#_head('AI'),#ListTile(leading: const Icon(Icons.lock_outline), title: const Text('App lock (PIN)'), subtitle: const Text('App kholne se pehle PIN maange'), onTap: () => showPinSetup(context)),\n          _head('AI'),#" lib/settings_page.dart
            grep -q "showPinSetup" lib/settings_page.dart || echo "WARNING: Settings me App lock ki row nahi judi"
          else
            echo "APPLOCK FILE NAHI HAI, skip"
          fi
          if [ -f lib/onboard.dart ]; then
            sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'onboard.dart';#" lib/main.dart
            W="OnboardGate(child: $W)"
          else
            echo "ONBOARD FILE NAHI HAI, skip"
          fi
          sed -i "s#home: const HomePage(),#builder: (context, child) => $W,\n      home: const HomePage(),#" lib/main.dart
          for k in "receptionist_tab.dart" "const CallsTab()" "Icons.contacts_outlined" "const ProtectCard()" "protect.dart" "const AiHub()" "builder: (context, child)"; do
            grep -q "$k" lib/main.dart || { echo "PATCH FAIL: $k"; exit 1; }
          done
          sed -i 's/SettingsPage/SettingsScreen/g' lib/settings_page.dart
          sed -i 's/const SettingsPage()/const SettingsScreen()/g' lib/main.dart
          grep -q "const SettingsScreen()" lib/main.dart || { echo "SETTINGS PATCH FAIL"; exit 1; }
          sed -i "s#'onlineCircle': true,#'onlineCircle': false,#" lib/settings_page.dart
          sed -i "s#'blockIntl': false,#'blockIntl': false,\n  'spamAnswer': false,#" lib/settings_page.dart
          sed -i "s#'Call reject hone par notification'),#'Call reject hone par notification'),\n          _sw('spamAnswer', 'Spam call apne aap uthao (beta)', 'Telemarketing 140/160 aur block list ki call reject ki jagah uthayi jayegi, chup rahegi, 30 second baad kategi'),#" lib/settings_page.dart
          grep -q "_sw('spamAnswer'" lib/settings_page.dart || echo "WARNING: spamAnswer switch nahi juda"
          sed -i "s#launchUrl(Uri(scheme: 'tel', path: n))#FlutterPhoneDirectCaller.callNumber(n)#" lib/calls_tab.dart
          sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'package:flutter_phone_direct_caller/flutter_phone_direct_caller.dart';#" lib/calls_tab.dart
          grep -q "FlutterPhoneDirectCaller" lib/calls_tab.dart || { echo "CALLS PATCH FAIL"; exit 1; }
          sed -i "s#Chhota jawab do aur batao mujhe kya karna chahiye.#Sabse pehli line me exactly likho SPAM SCORE: N/100 (0 matlab safe, 100 matlab pakka spam), phir ek line me wajah. Ye number kis telecom circle (state) aur operator ka hai, ye bhi batao, pakka na ho to saaf bolo. Chhota jawab do aur batao mujhe kya karna chahiye.#" lib/tabs.dart lib/calls_tab.dart
          grep -q "SPAM SCORE" lib/tabs.dart || echo "WARNING: spam score prompt badla nahi"
          cat > native/CallLogOps.kt << 'KOTLIN'
          package com.example.call_guard

          import android.content.Context
          import android.provider.CallLog

          object CallLogOps {
              fun delete(ctx: Context, number: String): Boolean {
                  try {
                      val digits = number.filter { it.isDigit() }
                      if (digits.length < 10) return false
                      val last10 = digits.takeLast(10)
                      val n = ctx.contentResolver.delete(
                          CallLog.Calls.CONTENT_URI,
                          "number LIKE ?",
                          arrayOf("%" + last10)
                      )
                      return n > 0
                  } catch (e: Throwable) {
                  }
                  return false
              }
          }
          KOTLIN
          cat > /tmp/del_home.dart << 'DART'
            Future<void> _delete(CallItem c) async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Call history se hatao?'),
                  content: Text(c.number),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(ctx, false),
                        child: const Text('Nahi')),
                    FilledButton(
                        onPressed: () => Navigator.pop(ctx, true),
                        child: const Text('Haan, hatao')),
                  ],
                ),
              );
              if (ok != true) return;
              bool done = false;
              try {
                done = await _hn.invokeMethod<bool>(
                        'deleteCalls', {'number': c.number}) ??
                    false;
              } catch (_) {}
              if (!done && mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(
                    content: Text('Permission allow karke dobara try karo')));
              }
              await _load();
            }

          DART
          cat > /tmp/del_calls.dart << 'DART'
            Future<void> _deleteCall(CallItem c) async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Call history se hatao?'),
                  content: Text(c.number),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(ctx, false),
                        child: const Text('Nahi')),
                    FilledButton(
                        onPressed: () => Navigator.pop(ctx, true),
                        child: const Text('Haan, hatao')),
                  ],
                ),
              );
              if (ok != true) return;
              bool done = false;
              try {
                done = await _native.invokeMethod<bool>(
                        'deleteCalls', {'number': c.number}) ??
                    false;
              } catch (_) {}
              if (!done && mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(
                    content: Text('Permission allow karke dobara try karo')));
              }
              await _init();
            }

          DART
          awk '/^ *bool _isSpam\(CallItem c\) =>/{while((getline l < "/tmp/del_home.dart")>0) print l} {print}' lib/main.dart > lib/main.tmp && mv lib/main.tmp lib/main.dart
          sed -i 's#onTap: () => showModalBottomSheet(#onLongPress: () => _delete(c),\n                  onTap: () => showModalBottomSheet(#' lib/main.dart
          awk '/^ *IconData _typeIcon\(int t\) \{/{while((getline l < "/tmp/del_calls.dart")>0) print l} {print}' lib/calls_tab.dart > lib/calls_tab.tmp && mv lib/calls_tab.tmp lib/calls_tab.dart
          sed -i '0,/onTap: () => _open(c),/s//onLongPress: () => _deleteCall(c),\n                          onTap: () => _open(c),/' lib/calls_tab.dart
          sed -i "s#Text('Haan, hatao')#Text('Yes')#" lib/main.dart lib/calls_tab.dart
          sed -i "s#Text('Haan, delete karo')#Text('Yes')#" lib/main.dart
          sed -i "s#const Text('Nahi')#const Text('No')#" lib/main.dart lib/calls_tab.dart
          sed -i "s#Call history se hatao?#Call history se delete karein?#" lib/main.dart lib/calls_tab.dart
          if [ -f lib/lang.dart ]; then
            for f in main tabs calls_tab; do
              sed -i "s#import 'package:flutter/material.dart';#import 'package:flutter/material.dart' hide Text;\nimport 'lang.dart';#" lib/$f.dart
              grep -q "import 'lang.dart'" lib/$f.dart || echo "WARNING: $f me language nahi juda"
            done
            sed -i "s#store.load();#store.load();\n    loadLang();#" lib/main.dart
            grep -q "loadLang();" lib/main.dart || echo "WARNING: loadLang nahi juda"
            sed -i "1i import 'lang.dart' show langNotifier;" lib/core.dart
            sed -i "s#{'text': system}#{'text': system + langHint()}#" lib/core.dart
            cat >> lib/core.dart << 'DART'

          String langHint() {
            final l = langNotifier.value;
            if (l == 'en') return ' Reply only in simple English.';
            if (l == 'or') return ' Reply only in Odia, using Odia script.';
            return '';
          }
          DART
            grep -q "langHint()" lib/core.dart || echo "WARNING: AI bhasha hint nahi juda"
          else
            echo "LANG FILE NAHI HAI, bhasha wala hissa skip"
          fi
          grep -q "onLongPress: () => _delete(c)" lib/main.dart || echo "WARNING: home me delete jura nahi"
          grep -q "Future<void> _deleteCall(CallItem c)" lib/calls_tab.dart || echo "WARNING: calls delete function jura nahi"
          echo "PREPARE OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name call_guard tmp_app
          cp -r tmp_app/android android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CALL_PHONE"/>\n    <uses-permission android:name="android.permission.READ_CALL_LOG"/>\n    <uses-permission android:name="android.permission.WRITE_CALL_LOG"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.READ_PHONE_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <application#' $M
          if grep -q "<queries>" $M; then
            sed -i 's#<queries>#<queries>\n    <intent><action android:name="android.speech.RecognitionService"/></intent>\n    <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>#' $M
          else
            sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' $M
          fi
          sed -i 's#</activity>#    <intent-filter><action android:name="android.intent.action.DIAL"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>\n    <intent-filter><action android:name="android.intent.action.DIAL"/><category android:name="android.intent.category.DEFAULT"/><data android:scheme="tel"/></intent-filter>\n    <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="tel"/></intent-filter>\n    </activity>#' $M
          sed -i 's#</application>#    <service android:name="com.example.call_guard.CallGuardScreeningService" android:permission="android.permission.BIND_SCREENING_SERVICE" android:exported="true"><intent-filter><action android:name="android.telecom.CallScreeningService"/></intent-filter></service>\n    <service android:name="com.example.call_guard.CallGuardInCallService" android:permission="android.permission.BIND_INCALL_SERVICE" android:exported="true"><meta-data android:name="android.telecom.IN_CALL_SERVICE_UI" android:value="true"/><intent-filter><action android:name="android.telecom.InCallService"/></intent-filter></service>\n    <activity android:name="com.example.call_guard.InCallActivity" android:exported="false" android:launchMode="singleInstance" android:excludeFromRecents="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"/>\n    </application>#' $M
          sed -i 's/android:label="[^"]*"/android:label="Call Guard"/' $M
          grep -q "xmlns:tools" $M || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          grep -q "allowBackup" $M || sed -i 's#<application#<application android:allowBackup="false" android:usesCleartextTraffic="false" tools:replace="android:allowBackup,android:usesCleartextTraffic"#' $M
          for g in android/app/build.gradle.kts android/app/build.gradle; do [ -f $g ] && sed -i 's/applicationId .*/applicationId = "com.jhulan.callguard"/' $g; done
          grep -q "CallGuardScreeningService" $M || { echo "MANIFEST SCREENING FAIL"; exit 1; }
          grep -q "CallGuardInCallService" $M || { echo "MANIFEST INCALL FAIL"; exit 1; }
          grep -q "android.intent.action.DIAL" $M || { echo "MANIFEST DIAL FAIL"; exit 1; }
          grep -q "READ_CALL_LOG" $M || { echo "MANIFEST CALLLOG FAIL"; exit 1; }
          grep -q "WRITE_CALL_LOG" $M || { echo "MANIFEST WRITE CALLLOG FAIL"; exit 1; }
          grep -q 'allowBackup="false"' $M || echo "WARNING: backup band nahi hua"
          grep -q "com.jhulan.callguard" android/app/build.gradle* || { echo "PACKAGE RENAME FAIL"; exit 1; }

      - name: App icon
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/values $R/mipmap-anydpi-v26
          cat > $R/values/cg_colors.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cg_icon_bg">#1565C0</color>
          </resources>
          XML
          cat > $R/drawable/cg_icon_fg.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,28 L77,36 V54 C77,67 67,77 54,82 C41,77 31,67 31,54 V36 Z"/>
              <path
                  android:strokeColor="#1565C0"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M43,54 L51,62 L65,46"/>
          </vector>
          XML
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/cg_icon_bg"/>
              <foreground android:drawable="@drawable/cg_icon_fg"/>
          </adaptive-icon>
          XML
          test -f $R/mipmap-anydpi-v26/ic_launcher.xml || { echo "ICON FAIL"; exit 1; }

      - name: Add phone number library
        run: |
          for g in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f $g ] && printf '\ndependencies {\n    implementation("com.googlecode.libphonenumber:libphonenumber:9.0.23")\n    implementation("com.googlecode.libphonenumber:geocoder:3.23")\n}\n' >> $g
          done
          grep -q "geocoder" android/app/build.gradle* || { echo "GEOCODER ADD FAIL"; exit 1; }

      - name: Add native code
        run: |
          rm -f $(find android/app/src/main -name 'MainActivity.*')
          mkdir -p android/app/src/main/kotlin/com/example/call_guard
          cp native/*.kt android/app/src/main/kotlin/com/example/call_guard/
          F=android/app/src/main/kotlin/com/example/call_guard
          sed -i 's#if (spam) speakSpam()#if (spam \&\& getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.spamVoice", true)) speakSpam()#' $F/CallGuardScreeningService.kt
          sed -i 's#val label = if (n.length == 10) findLabel(n) else null#val label = if (n.length == 10 \&\& getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.autoBlock", true) \&\& !getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.spamAnswer", false)) findLabel(n) else null#' $F/CallGuardScreeningService.kt
          sed -i 's#if (label != null) {#val sp = getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)\n                val abOn = sp.getBoolean("flutter.autoBlock", true)\n                val spamAns = sp.getBoolean("flutter.spamAnswer", false)\n                val label2 = label ?: (if (!abOn) null else if ((n.startsWith("140") || n.startsWith("160")) \&\& !spamAns \&\& sp.getBoolean("flutter.blockTele", false)) "Telemarketing" else if (raw.isEmpty() \&\& sp.getBoolean("flutter.blockHidden", false)) "Hidden number" else if (raw.startsWith("+") \&\& !raw.startsWith("+91") \&\& sp.getBoolean("flutter.blockIntl", false)) "International" else null)\n                if (label2 != null) {#' $F/CallGuardScreeningService.kt
          sed -i 's#(\$label)#(\$label2)#' $F/CallGuardScreeningService.kt
          sed -i 's#^\( *\)show("callguard_info"#\1if (getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.infoPopup", true)) show("callguard_info"#' $F/CallGuardScreeningService.kt
          sed -i 's#^\( *\)show("callguard_alerts"#\1if (getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.blockNotif", true)) show("callguard_alerts"#' $F/CallGuardScreeningService.kt
          sed -i 's#"requestNotificationPermission" -> requestNotif(result)#"requestNotificationPermission" -> requestNotif(result)\n                    "isDefaultDialer" -> result.success(DialerRole.isDefault(this))\n                    "requestDialerRole" -> { DialerRole.request(this); result.success(true) }#' $F/MainActivity.kt
          sed -i 's#"requestNotificationPermission" -> requestNotif(result)#"requestNotificationPermission" -> requestNotif(result)\n                    "deleteCalls" -> { if (checkSelfPermission(Manifest.permission.WRITE_CALL_LOG) != PackageManager.PERMISSION_GRANTED) { requestPermissions(arrayOf(Manifest.permission.WRITE_CALL_LOG), 1009); result.success(false) } else { result.success(CallLogOps.delete(this, call.argument<String>("number") ?: "")) } }#' $F/MainActivity.kt
          sed -i 's#stateView?.text = if (tag != null) base + "  |  SPAM - " + tag else base#stateView?.text = (if (tag != null) base + "  |  SPAM - " + tag else base) + CallHolder.circleFor(num)#' $F/InCallActivity.kt
          grep -q "flutter.spamVoice" $F/CallGuardScreeningService.kt || echo "WARNING: spamVoice switch jura nahi"
          grep -q "flutter.autoBlock" $F/CallGuardScreeningService.kt || echo "WARNING: autoBlock switch jura nahi"
          grep -q "flutter.blockTele" $F/CallGuardScreeningService.kt || echo "WARNING: blockTele switch jura nahi"
          grep -q "flutter.spamAnswer" $F/CallGuardScreeningService.kt || echo "WARNING: spamAnswer screening me nahi juda"
          grep -q "flutter.spamAnswer" $F/CallGuardInCallService.kt || echo "WARNING: spamAnswer incall me nahi juda"
          grep -q "requestDialerRole" $F/MainActivity.kt || echo "WARNING: default button jura nahi"
          grep -q "deleteCalls" $F/MainActivity.kt || echo "WARNING: delete native jura nahi"
          echo "NATIVE OK"

      - name: Fixed signing key
        run: |
          if [ -f signing/debug.b64 ]; then
            mkdir -p ~/.android
            base64 -d signing/debug.b64 > ~/.android/debug.keystore
            base64 -d signing/debug.b64 > android/app/cg.jks
            K=android/app/build.gradle.kts
            if [ -f $K ]; then
              sed -i 's#buildTypes {#signingConfigs {\n        create("cg") {\n            storeFile = file("cg.jks")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n    buildTypes {#' $K
              sed -i 's#signingConfigs.getByName("debug")#signingConfigs.getByName("cg")#' $K
              grep -q 'getByName("cg")' $K || echo "WARNING: signing config laga nahi"
            else
              echo "WARNING: build.gradle.kts nahi mili"
            fi
            echo "FIXED KEY LAGA"
          else
            echo "SIGNING KEY NAHI MILI"
          fi

      - run: flutter pub get

      - run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      - name: Show signing fingerprint
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner
          $AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || echo "fingerprint nahi mila"

      - name: Build Play Store bundle
        env:
          UP_KS: ${{ secrets.UPLOAD_KS_B64 }}
          UP_PASS: ${{ secrets.UPLOAD_KS_PASS }}
        run: |
          if [ -z "$UP_KS" ] || [ -z "$UP_PASS" ]; then
            echo "UPLOAD KEY SECRET NAHI HAI, bundle skip"
            exit 0
          fi
          echo "$UP_KS" | base64 -d > android/app/up.jks
          K=android/app/build.gradle.kts
          grep -q 'create("cg") {' $K || { echo "BUNDLE: cg config nahi mili"; exit 1; }
          sed -i 's#create("cg") {#create("up") {\n            storeFile = file("up.jks")\n            storePassword = System.getenv("UP_PASS")\n            keyAlias = "upload"\n            keyPassword = System.getenv("UP_PASS")\n        }\n        create("cg") {#' $K
          sed -i 's#signingConfigs.getByName("cg")#signingConfigs.getByName("up")#' $K
          grep -q 'getByName("up")' $K || { echo "BUNDLE: up config laga nahi"; exit 1; }
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -i "SHA256" || echo "bundle fingerprint nahi mila"

      - uses: actions/upload-artifact@v4
        with:
          name: call-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('build/app/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: call-guard-aab
          path: build/app/outputs/bundle/release/app-release.aab
