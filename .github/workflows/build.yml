name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name call_guard tmp_app
          cp -r tmp_app/android .
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_CONTACTS"\/>\n<uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n<application/' android/app/src/main/AndroidManifest.xml

      - name: Play Store fixes
        run: |
          sed -i '/READ_SMS/d; /SEND_SMS/d' android/app/src/main/AndroidManifest.xml
      - name: Add native code
        run: |
          rm -rf $(find android/app/src/main -name "MainActivity.*")
          mkdir -p android/app/src/main/kotlin/com/example/call_guard
          cat > android/app/src/main/kotlin/com/example/call_guard/MainActivity.kt << 'EOF'
          package com.example.call_guard

          import android.Manifest
          import android.app.Activity
          import android.app.role.RoleManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.CallLog
          import android.provider.ContactsContract
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
