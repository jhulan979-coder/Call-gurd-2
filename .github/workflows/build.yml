name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project files
        run: |
          mkdir -p lib
          for f in main core tabs ai_tab calls_tab; do
            if [ ! -f lib/$f.dart ]; then
              if [ -f $f.dart ]; then
                cp $f.dart lib/$f.dart
              elif [ -f .github/workflows/$f.dart ]; then
                cp .github/workflows/$f.dart lib/$f.dart
              fi
            fi
          done
          test -f lib/main.dart || (echo "MAIN.DART NAHI MILI" && exit 1)
          test -f lib/core.dart || (echo "CORE.DART NAHI MILI" && exit 1)
          test -f lib/tabs.dart || (echo "TABS.DART NAHI MILI" && exit 1)
          test -f lib/ai_tab.dart || (echo "AI_TAB.DART NAHI MILI" && exit 1)
          test -f lib/calls_tab.dart || (echo "CALLS_TAB.DART NAHI MILI" && exit 1)
          sed -i "s#import 'ai_tab.dart';#import 'ai_tab.dart';\nimport 'calls_tab.dart';#" lib/main.dart
          sed -i "s#const BlockedTab(),#const BlockedTab(),\n          const CallsTab(),#" lib/main.dart
          sed -i "s#label: 'Blocked'),#label: 'Blocked'),\n          NavigationDestination(icon: Icon(Icons.call_outlined), label: 'Calls'),#" lib/main.dart
          grep -q "calls_tab.dart" lib/main.dart || (echo "PATCH1 FAIL" && exit 1)
          grep -q "const CallsTab()" lib/main.dart || (echo "PATCH2 FAIL" && exit 1)
          grep -q "Icons.call_outlined" lib/main.dart || (echo "PATCH3 FAIL" && exit 1)
          if [ ! -f pubspec.yaml ]; then
            cat > pubspec.yaml << 'EOF'
          name: call_guard
          description: Call Guard - spam number checker and block list.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.0
            http: ^1.2.0

          flutter:
            uses-material-design: true
          EOF
          fi
          ls -la . lib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name call_guard tmp_app
          cp -r tmp_app/android android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_CALL_LOG"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Add native call log code
        run: |
          rm -f $(find android/app/src/main -name 'MainActivity.*')
          mkdir -p android/app/src/main/kotlin/com/example/call_guard
          cat > android/app/src/main/kotlin/com/example/call_guard/MainActivity.kt << 'KOTLIN'
          package com.example.call_guard

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.CallLog
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var pending: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "callguard/native")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "hasCallLogPermission" -> result.success(hasPerm())
                              "requestCallLogPermission" -> {
                                  if (hasPerm()) {
                                      result.success(true)
                                  } else {
                                      pending = result
                                      requestPermissions(arrayOf(Manifest.permission.READ_CALL_LOG), 1001)
                                  }
                              }
                              "getRecentCalls" -> result.success(readCalls())
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun hasPerm(): Boolean {
                  return checkSelfPermission(Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1001) {
                      pending?.success(grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED)
                      pending = null
                  }
              }

              private fun readCalls(): List<Map<String, Any?>> {
                  val out = ArrayList<Map<String, Any?>>()
                  val cursor = contentResolver.query(
                      CallLog.Calls.CONTENT_URI,
                      arrayOf(CallLog.Calls.NUMBER, CallLog.Calls.CACHED_NAME, CallLog.Calls.DATE, CallLog.Calls.TYPE),
                      null, null, CallLog.Calls.DATE + " DESC"
                  )
                  cursor?.use {
                      var count = 0
                      while (it.moveToNext() && count < 100) {
                          out.add(mapOf(
                              "number" to it.getString(0),
                              "name" to it.getString(1),
                              "date" to it.getLong(2),
                              "type" to it.getInt(3)
                          ))
                          count++
                      }
                  }
                  return out
              }
          }
          KOTLIN

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: call-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
