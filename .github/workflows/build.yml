name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project files
        run: |
          mkdir -p lib
          if [ ! -f lib/main.dart ]; then
            F=$(find . -path ./.git -prune -o -type f -name 'main.dart' -print | head -n 1)
            echo "Found: $F"
            if [ -n "$F" ]; then cp "$F" lib/main.dart; fi
          fi
          test -f lib/main.dart || (echo "MAIN.DART REPO ME NAHI HAI" && exit 1)
          if [ ! -f pubspec.yaml ]; then
            cat > pubspec.yaml << 'EOF'
          name: call_guard
          description: Call Guard - spam number checker and block list.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.0
            http: ^1.2.0

          flutter:
            uses-material-design: true
          EOF
          fi
          ls -la . lib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name call_guard tmp_app
          cp -r tmp_app/android android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: call-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
