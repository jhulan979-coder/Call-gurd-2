name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p lib native
          for f in main core tabs ai_tab calls_tab protect receptionist_tab sms_tab settings_page; do
            if [ -f $f.dart ]; then cp $f.dart lib/$f.dart; else cp .github/workflows/$f.dart lib/$f.dart; fi
          done
          for k in MainActivity CallGuardScreeningService CallGuardInCallService InCallActivity DialerRole CircleLookup; do
            [ -f native/$k.kt ] || cp $k.kt native/$k.kt || cp .github/workflows/$k.kt native/$k.kt || { echo "$k.kt NAHI MILI"; exit 1; }
          done
          test -f pubspec.yaml || { echo "PUBSPEC NAHI MILI"; exit 1; }
          sed -i "s#import 'ai_tab.dart';#import 'ai_tab.dart';\nimport 'receptionist_tab.dart';#" lib/main.dart
          sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'protect.dart';\nimport 'settings_page.dart';#" lib/main.dart
          sed -i "s#const BlockedTab(),#const BlockedTab(),\n          const CallsTab(),#" lib/main.dart
          sed -i "s#const AiTab(),#const AiHub(),#" lib/main.dart
          sed -i "s#label: 'Blocked'),#label: 'Blocked'),\n          NavigationDestination(icon: Icon(Icons.contacts_outlined), label: 'Contacts'),#" lib/main.dart
          sed -i "s#const SizedBox(height: 8),#const SizedBox(height: 8),\n            const ProtectCard(),\n            const SizedBox(height: 8),#" lib/main.dart
          for k in "receptionist_tab.dart" "const CallsTab()" "Icons.contacts_outlined" "const ProtectCard()" "protect.dart" "const AiHub()"; do
            grep -q "$k" lib/main.dart || { echo "PATCH FAIL: $k"; exit 1; }
          done
          sed -i 's/SettingsPage/SettingsScreen/g' lib/settings_page.dart
          sed -i 's/const SettingsPage()/const SettingsScreen()/g' lib/main.dart
          grep -q "const SettingsScreen()" lib/main.dart || { echo "SETTINGS PATCH FAIL"; exit 1; }
          sed -i "s#'blockNotif': true,#'blockNotif': true,\n    'onlineCircle': true,#" lib/settings_page.dart
          sed -i "s#'Call reject hone par notification'),#'Call reject hone par notification'),\n          _sw('onlineCircle', 'Unknown number ka state (online AI)', 'Gemini API key se. Number Google ko jata hai'),#" lib/settings_page.dart
          grep -q "onlineCircle" lib/settings_page.dart || echo "WARNING: state switch jura nahi"
          sed -i "s#launchUrl(Uri(scheme: 'tel', path: n))#FlutterPhoneDirectCaller.callNumber(n)#" lib/calls_tab.dart
          sed -i "s#import 'core.dart';#import 'core.dart';\nimport 'package:flutter_phone_direct_caller/flutter_phone_direct_caller.dart';#" lib/calls_tab.dart
          grep -q "FlutterPhoneDirectCaller" lib/calls_tab.dart || { echo "CALLS PATCH FAIL"; exit 1; }
          sed -i "s#Chhota jawab do aur batao mujhe kya karna chahiye.#Ye number kis telecom circle (state) aur operator ka hai, ye bhi batao, pakka na ho to saaf bolo. Chhota jawab do aur batao mujhe kya karna chahiye.#" lib/tabs.dart lib/calls_tab.dart
          echo "PREPARE OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name call_guard tmp_app
          cp -r tmp_app/android android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CALL_PHONE"/>\n    <uses-permission android:name="android.permission.READ_CALL_LOG"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.READ_PHONE_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          if grep -q "<queries>" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<queries>#<queries>\n    <intent><action android:name="android.speech.RecognitionService"/></intent>\n    <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>#' android/app/src/main/AndroidManifest.xml
          else
            sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's#</activity>#    <intent-filter><action android:name="android.intent.action.DIAL"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>\n    <intent-filter><action android:name="android.intent.action.DIAL"/><category android:name="android.intent.category.DEFAULT"/><data android:scheme="tel"/></intent-filter>\n    <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="tel"/></intent-filter>\n    </activity>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <service android:name="com.example.call_guard.CallGuardScreeningService" android:permission="android.permission.BIND_SCREENING_SERVICE" android:exported="true"><intent-filter><action android:name="android.telecom.CallScreeningService"/></intent-filter></service>\n    <service android:name="com.example.call_guard.CallGuardInCallService" android:permission="android.permission.BIND_INCALL_SERVICE" android:exported="true"><meta-data android:name="android.telecom.IN_CALL_SERVICE_UI" android:value="true"/><intent-filter><action android:name="android.telecom.InCallService"/></intent-filter></service>\n    <activity android:name="com.example.call_guard.InCallActivity" android:exported="false" android:launchMode="singleInstance" android:excludeFromRecents="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Call Guard"/' android/app/src/main/AndroidManifest.xml
          for g in android/app/build.gradle.kts android/app/build.gradle; do [ -f $g ] && sed -i 's/applicationId .*/applicationId = "com.jhulan.callguard"/' $g; done
          grep -q "CallGuardScreeningService" android/app/src/main/AndroidManifest.xml || { echo "MANIFEST SCREENING FAIL"; exit 1; }
          grep -q "CallGuardInCallService" android/app/src/main/AndroidManifest.xml || { echo "MANIFEST INCALL FAIL"; exit 1; }
          grep -q "android.intent.action.DIAL" android/app/src/main/AndroidManifest.xml || { echo "MANIFEST DIAL FAIL"; exit 1; }
          grep -q "READ_CALL_LOG" android/app/src/main/AndroidManifest.xml || { echo "MANIFEST CALLLOG FAIL"; exit 1; }
          grep -q "com.jhulan.callguard" android/app/build.gradle* || { echo "PACKAGE RENAME FAIL"; exit 1; }

      - name: App icon
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/values $R/mipmap-anydpi-v26
          cat > $R/values/cg_colors.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cg_icon_bg">#1565C0</color>
          </resources>
          XML
          cat > $R/drawable/cg_icon_fg.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,28 L77,36 V54 C77,67 67,77 54,82 C41,77 31,67 31,54 V36 Z"/>
              <path
                  android:strokeColor="#1565C0"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M43,54 L51,62 L65,46"/>
          </vector>
          XML
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/cg_icon_bg"/>
              <foreground android:drawable="@drawable/cg_icon_fg"/>
          </adaptive-icon>
          XML
          test -f $R/mipmap-anydpi-v26/ic_launcher.xml || { echo "ICON FAIL"; exit 1; }

      - name: Add phone number library
        run: |
          for g in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f $g ] && printf '\ndependencies {\n    implementation("com.googlecode.libphonenumber:libphonenumber:9.0.23")\n    implementation("com.googlecode.libphonenumber:geocoder:3.23")\n}\n' >> $g
          done
          grep -q "geocoder" android/app/build.gradle* || { echo "GEOCODER ADD FAIL"; exit 1; }

      - name: Add native code
        run: |
          rm -f $(find android/app/src/main -name 'MainActivity.*')
          mkdir -p android/app/src/main/kotlin/com/example/call_guard
          cp native/*.kt android/app/src/main/kotlin/com/example/call_guard/
          F=android/app/src/main/kotlin/com/example/call_guard
          sed -i 's#if (spam) speakSpam()#if (spam \&\& getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.spamVoice", true)) speakSpam()#' $F/CallGuardScreeningService.kt
          sed -i 's#val label = if (n.length == 10) findLabel(n) else null#val label = if (n.length == 10 \&\& getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.autoBlock", true)) findLabel(n) else null#' $F/CallGuardScreeningService.kt
          sed -i 's#^\( *\)show("callguard_info"#\1if (getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.infoPopup", true)) show("callguard_info"#' $F/CallGuardScreeningService.kt
          sed -i 's#^\( *\)show("callguard_alerts"#\1if (getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.blockNotif", true)) show("callguard_alerts"#' $F/CallGuardScreeningService.kt
          sed -i 's#^            startFlip()$#            if (getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE).getBoolean("flutter.flip", true)) startFlip()#' $F/CallGuardInCallService.kt
          sed -i 's#"requestNotificationPermission" -> requestNotif(result)#"requestNotificationPermission" -> requestNotif(result)\n                    "isDefaultDialer" -> result.success(DialerRole.isDefault(this))\n                    "requestDialerRole" -> { DialerRole.request(this); result.success(true) }#' $F/MainActivity.kt
          sed -i 's#stateView?.text = if (tag != null) base + "  |  SPAM - " + tag else base#stateView?.text = (if (tag != null) base + "  |  SPAM - " + tag else base) + CallHolder.circleFor(num)#' $F/InCallActivity.kt
          grep -q "flutter.spamVoice" $F/CallGuardScreeningService.kt || echo "WARNING: spamVoice switch jura nahi"
          grep -q "flutter.autoBlock" $F/CallGuardScreeningService.kt || echo "WARNING: autoBlock switch jura nahi"
          grep -q "flutter.infoPopup" $F/CallGuardScreeningService.kt || echo "WARNING: infoPopup switch jura nahi"
          grep -q "flutter.blockNotif" $F/CallGuardScreeningService.kt || echo "WARNING: blockNotif switch jura nahi"
          grep -q "flutter.flip" $F/CallGuardInCallService.kt || echo "WARNING: flip switch jura nahi"
          grep -q "requestDialerRole" $F/MainActivity.kt || echo "WARNING: default button jura nahi"
          grep -q "circleFor" $F/InCallActivity.kt || echo "WARNING: call screen par state jura nahi"
          echo "NATIVE OK"

      - name: Fixed signing key
        run: |
          if [ -f signing/debug.b64 ]; then
            mkdir -p ~/.android
            base64 -d signing/debug.b64 > ~/.android/debug.keystore
            base64 -d signing/debug.b64 > android/app/cg.jks
            K=android/app/build.gradle.kts
            if [ -f $K ]; then
              sed -i 's#buildTypes {#signingConfigs {\n        create("cg") {\n            storeFile = file("cg.jks")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n    buildTypes {#' $K
              sed -i 's#signingConfigs.getByName("debug")#signingConfigs.getByName("cg")#' $K
              grep -q 'getByName("cg")' $K || echo "WARNING: signing config laga nahi"
            else
              echo "WARNING: build.gradle.kts nahi mili"
            fi
            echo "FIXED KEY LAGA"
          else
            echo "SIGNING KEY NAHI MILI"
          fi

      - run: flutter pub get

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Show signing fingerprint
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner
          $AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || echo "fingerprint nahi mila"

      - uses: actions/upload-artifact@v4
        with:
          name: call-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
